# Free-plan Supabase pauses after ~7 days without DB traffic.
# Paid (Pro) orgs never pause. This ping is the free-plan workaround.
name: supabase-keepalive
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST (SELECT 1 row)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Set GitHub secrets SUPABASE_URL and SUPABASE_ANON_KEY"
            exit 1
          fi
          curl -sfS "${SUPABASE_URL%/}/rest/v1/zones?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Range: 0-0" >/dev/null
          echo "keepalive ok"
